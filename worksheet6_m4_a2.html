<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet 6 M4 A2: Dreams and Life Goals</title>
<style>
* { box-sizing:border-box;margin:0;padding:0; }
body { font-family:'Segoe UI',sans-serif;background:#f0fdff;color:#1e1b4b;min-height:100vh; }
.ws-header { background:linear-gradient(135deg,#0f766e,#0891b2);color:white;text-align:center;padding:28px 20px 22px; }
.ws-header h1 { font-size:1.7rem;font-weight:800;letter-spacing:.5px; }
.ws-header p { font-size:.95rem;opacity:.88;margin-top:6px; }
.info-banner { background:#eef2ff;border-left:4px solid #6366f1;margin:20px auto;max-width:860px;padding:12px 18px;border-radius:8px;font-size:.93rem;color:#3730a3; }
.info-banner strong { color:#4338ca; }
.card { background:white;border-radius:14px;box-shadow:0 2px 12px rgba(79,70,229,.10);max-width:860px;margin:0 auto 24px;padding:28px; }
.form-group { margin-bottom:18px; }
label { display:block;font-weight:600;margin-bottom:6px;font-size:.9rem;color:#4338ca; }
select,input[type=text] { width:100%;padding:10px 14px;border:2px solid #e0e7ff;border-radius:8px;font-size:.95rem;color:#1e1b4b;background:#f8f9ff; }
select:focus,input:focus { outline:none;border-color:#6366f1; }
.form-row { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
input[readonly] { background:#f1f5f9;color:#64748b;cursor:not-allowed; }
.btn-primary { width:100%;padding:14px;background:linear-gradient(135deg,#0f766e,#0891b2);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px; }
.btn-primary:hover { opacity:.93; }
.btn-primary:disabled { opacity:.5;cursor:not-allowed; }
.quiz-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px; }
#quizStudentInfo { font-weight:700;font-size:1rem;color:#4338ca; }
.attempts-display { background:#eef2ff;border-radius:8px;padding:6px 14px;font-size:.85rem;color:#4338ca;font-weight:600; }
.question-card { background:#fafbff;border:2px solid #e0e7ff;border-radius:12px;padding:20px;margin-bottom:18px;transition:border-color .2s; }
.question-card.answered { border-color:#6366f1; }
.question-number { font-size:.78rem;font-weight:700;color:#6366f1;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px; }
.question-text { font-size:1rem;font-weight:600;color:#1e1b4b;margin-bottom:14px;line-height:1.5; }
.question-image { width:100%;max-width:400px;height:auto;border-radius:10px;margin:10px 0;display:block; }
.options-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
@media (max-width:560px) { .options-grid { grid-template-columns:1fr; } }
.option-btn { display:flex;align-items:center;padding:10px 14px;border:2px solid #e0e7ff;border-radius:8px;background:white;cursor:pointer;font-size:.93rem;color:#374151;text-align:left;transition:all .15s;font-family:inherit; }
.option-btn:hover { border-color:#6366f1;background:#eef2ff; }
.option-btn.selected { border-color:#6366f1;background:#eef2ff;color:#3730a3;font-weight:600; }
.option-btn.correct { border-color:#16a34a;background:#dcfce7;color:#15803d; }
.option-btn.incorrect { border-color:#dc2626;background:#fee2e2;color:#991b1b; }
#submitBtn { display:block; margin-top:20px; }
#resultSection { display:none; }
.score-display { text-align:center;padding:30px 20px; }
.score-circle { width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;margin:0 auto 16px; }
.score-pass { background:#dcfce7;color:#15803d;border:4px solid #16a34a; }
.score-fail { background:#fee2e2;color:#991b1b;border:4px solid #dc2626; }
.score-label { font-size:1.1rem;font-weight:700;color:#1e1b4b; }
.score-sub { font-size:.9rem;color:#64748b;margin-top:4px; }
.submission-timestamp { font-size:.9rem;color:#555;margin:10px auto 4px;font-weight:500;padding:7px 18px;background:#f0f4ff;border-radius:8px;display:none; }
.submission-timestamp.late { color:#dc2626;font-weight:600;background:#fff5f5; }
.feedback-msg { text-align:center;font-size:1rem;margin:16px 0;padding:12px;border-radius:8px; }
.feedback-pass { background:#dcfce7;color:#15803d; }
.feedback-fail { background:#fee2e2;color:#991b1b; }
.btn-retry { display:block;width:100%;max-width:280px;margin:16px auto 0;padding:12px;background:#6366f1;color:white;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer; }
h2 { font-size:1.15rem;font-weight:700;color:#4338ca;margin-bottom:20px; }
#quizSection { display:none; }
@media print {
  .info-banner,.card:has(#formSection),.card:has(#quizSection),.btn-retry { display:none!important; }
  #resultSection { display:block!important; }
  .submission-timestamp { display:block!important; }
}
</style></head><body>
<div class="ws-header"><h1>📖 WORKSHEET 6 📖</h1><p>Dreams and Life Goals</p><p>M4 (A2) &nbsp;|&nbsp; Sections 10–13</p></div>
<div class="info-banner"><strong>Instructions:</strong> Select your class section and name, then answer all 10 questions. You have <strong>3 attempts</strong>. Questions and choices are shuffled — good luck!</div>
<div class="card" id="formSection">
<h2>👤 Student Information</h2>
<div class="form-group"><label for="section">Class Section</label>
<select id="section" onchange="loadThaiNames(this.value)">
<option value="">— Select your section —</option>
<option value="M4/10">M4/10</option><option value="M4/11">M4/11</option><option value="M4/12">M4/12</option><option value="M4/13">M4/13</option>
</select></div>
<div class="form-group"><label for="thaiName">Your Name (ชื่อ)</label>
<select id="thaiName" disabled onchange="autoFillStudent(this)"><option value="">— Select your section first —</option></select></div>
<div class="form-row">
<div class="form-group"><label>Nickname</label><input type="text" id="nickname" readonly placeholder="Auto-filled"></div>
<div class="form-group"><label>Student ID</label><input type="text" id="studentId" readonly placeholder="Auto-filled"></div>
</div>
<button class="btn-primary" id="startBtn" onclick="startQuiz()" disabled>Start Worksheet ▶</button>
</div>
<div class="card" id="quizSection">
<div class="quiz-header"><div id="quizStudentInfo"></div><div class="attempts-display" id="attemptsDisplay"></div></div>
<div id="questionsContainer"></div>
<button class="btn-primary" id="submitBtn" onclick="submitQuiz()">Submit Answers ✓</button>
</div>
<div class="card" id="resultSection">
<div class="score-display">
  <div class="score-circle" id="scoreCircle"></div>
  <div class="score-label" id="scoreLabel"></div>
  <div class="score-sub" id="scoreSub"></div>
  <div id="submissionTimestamp" class="submission-timestamp"></div>
</div>
<div class="feedback-msg" id="feedbackMsg"></div>
<button class="btn-retry" id="retryBtn" onclick="retryQuiz()" style="display:none">Try Again 🔄</button>
</div>
<script>
var SUPABASE_URL='https://smtgkffnptwjlgccsrti.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdGdrZmZucHR3amxnY2NzcnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDAxODIsImV4cCI6MjA5ODExNjE4Mn0.F2wlmHBtCPEqfZFiutSwtpH79TPe5GbJh1p3y6rm4qs';
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbx24U-FiTB6LvzvU_zEHqTbcC9GG-SWUhTRAHbPbO_arkcoskrV1qmjZFZ7RAF3Y7hf/exec';
var TEST_STUDENT_IDS=['54565'];
var maxAttempts=3;
var isKyleTestMode=(new URLSearchParams(window.location.search).get('testmode')=='kyle');
var KYLE_DATA={id:'54565',name:'Kyle',nick:'Kyle'};
var studentData={};

// ─── SCHEDULE & TIMESTAMP ─────────────────────────────────────────────────────
var SECTION_SCHEDULE={
  'M4/10': {year:2026,month:8,day:3},
  'M4/11': {year:2026,month:8,day:6},
  'M4/12': {year:2026,month:8,day:6},
  'M4/13': {year:2026,month:8,day:7}
};
var submissionTimestampISO='';
var submissionTimestampDisplay='';
var submissionIsLate=false;

function captureSubmissionTime(section){
  var now=new Date();
  submissionTimestampISO=now.toISOString();
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var h=now.getHours(),m=now.getMinutes();
  var ampm=h>=12?'PM':'AM';
  var hh=h%12||12;
  var mm=String(m).padStart(2,'0');
  submissionTimestampDisplay=hh+':'+mm+' '+ampm+', '+months[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear()+', '+weekdays[now.getDay()];
  var sched=SECTION_SCHEDULE[section];
  if(!sched){submissionIsLate=false;return;}
  submissionIsLate=(now.getFullYear()!==sched.year||now.getMonth()+1!==sched.month||now.getDate()!==sched.day);
}

function showTimestampEl(){
  var el=document.getElementById('submissionTimestamp');
  if(!el)return;
  el.textContent='Submission: '+submissionTimestampDisplay+(submissionIsLate?' — Late':'');
  el.style.display='block';
  el.className='submission-timestamp'+(submissionIsLate?' late':'');
}

async function loadStudentsFromSupabase(s){
  var r=await fetch(SUPABASE_URL+'/rest/v1/students?select=student_id,nickname,name,thai_name&section=eq.'+encodeURIComponent(s)+'&is_test=neq.true&order=thai_name.asc',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
  studentData[s]=await r.json();
}

async function loadThaiNames(section){
  var sel=document.getElementById('thaiName');
  sel.innerHTML='<option value="">— Loading... —</option>';sel.disabled=true;
  document.getElementById('nickname').value='';document.getElementById('studentId').value='';
  if(!section){sel.innerHTML='<option value="">— Select your section first —</option>';document.getElementById('startBtn').disabled=true;return;}
  if(isKyleTestMode){sel.innerHTML='';var k=document.createElement('option');k.value=KYLE_DATA.id;k.textContent=KYLE_DATA.name;k.dataset.nick=KYLE_DATA.nick;k.dataset.name=KYLE_DATA.name;sel.appendChild(k);sel.disabled=false;autoFillStudent(sel);return;}
  if(!studentData[section])await loadStudentsFromSupabase(section);
  sel.innerHTML='<option value="">— Select your name —</option>';
  studentData[section].forEach(function(s){var o=document.createElement('option');o.value=s.student_id;o.textContent=(s.thai_name||s.name)+' ('+s.nickname+')';o.dataset.nick=s.nickname||s.name;o.dataset.name=s.thai_name||s.name;sel.appendChild(o);});sel.disabled=false;
}

function autoFillStudent(sel){
  sel=sel||document.getElementById('thaiName');
  var o=sel.options[sel.selectedIndex];
  if(o&&o.value){document.getElementById('nickname').value=o.dataset.nick||o.dataset.name;document.getElementById('studentId').value=o.value;document.getElementById('startBtn').disabled=false;}
  else{document.getElementById('nickname').value='';document.getElementById('studentId').value='';document.getElementById('startBtn').disabled=true;}
}

function seededShuffle(arr,seed){var a=arr.slice();for(var i=a.length-1;i>0;i--){seed=(seed*1664525+1013904223)&0xffffffff;var j=Math.abs(seed)%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var questions=[
{id:1,text:'What does the phrase "long-term goal" mean?',options:['A goal you want to reach within a few days','A goal that only others can help you with','A goal that is impossible for most people','A goal you plan to achieve over many years'],answer:'A goal you plan to achieve over many years'},
{id:2,text:'Which sentence best shows someone with a "vision for the future"?',options:['"I never think about what comes next."','"I plan to launch a social enterprise that reduces food waste by 2030."','"I only care about today, not tomorrow."','"I do whatever my friends decide."'],answer:'"I plan to launch a social enterprise that reduces food waste by 2030."'},
{id:3,text:'What does "perseverance" mean when pursuing a goal?',options:['Giving up quickly when facing the first difficulty','Asking others to complete tasks for you','Continuing to try even when things are difficult','Avoiding situations that require too much effort'],answer:'Continuing to try even when things are difficult'},
{id:4,text:'Choose the best word: "Despite many setbacks, she _____ her dream of becoming an architect."',options:['abandoned','forgot','criticized','pursued'],answer:'pursued'},
{id:5,text:'What is the key difference between a "dream" and a "goal"?',options:['Dreams are about money; goals are about feelings.','A dream is a wish or desire; a goal is a specific plan to achieve something.','Goals are imaginary; dreams are real plans.','There is no meaningful difference between them.'],answer:'A dream is a wish or desire; a goal is a specific plan to achieve something.'},
{id:6,text:'What does "self-motivation" mean?',options:['Relying on others to push you to act','The ability to encourage yourself to take action without external pressure','Feeling motivated only when you receive a reward','Being motivated only by competition with others'],answer:'The ability to encourage yourself to take action without external pressure'},
{id:7,text:'Napat set this goal: "I will study English 30 minutes daily for six months to pass IELTS." What makes this well-structured?',options:['It is easy and requires almost no effort.','It involves other people doing the work.','It is specific, measurable, and has a clear timeline.','It can be changed at any time with no consequences.'],answer:'It is specific, measurable, and has a clear timeline.'},
{id:8,text:'Which best describes someone with "clarity of purpose"?',options:['Someone who frequently changes their mind about the future','Someone who follows whatever career their parents choose','Someone who avoids making any decisions about the future','Someone who clearly understands what they want to achieve and why'],answer:'Someone who clearly understands what they want to achieve and why'},
{id:9,text:'"Overcoming obstacles is essential to realising your dreams." What does "obstacles" mean here?',options:['Supportive people who encourage your progress','Rewards you receive after succeeding','Plans you make carefully in advance','Challenges or difficulties that block your path to success'],answer:'Challenges or difficulties that block your path to success'},
{id:10,text:'Which is the BEST advice for turning a dream into reality?',options:['Keep your dreams secret so no one can judge them.','Wait until all conditions are perfect before starting.','Break your dream into smaller, manageable steps and take consistent action.','Focus only on the end result and ignore the process entirely.'],answer:'Break your dream into smaller, manageable steps and take consistent action.'}
];

var attempts=0,userAnswers={},displayQuestions=[],currentStudentId='',currentNickname='',currentSection='',quizLocked=false;

function startQuiz(){
  var sid=document.getElementById('studentId').value,nick=document.getElementById('nickname').value,sec=document.getElementById('section').value;
  if(!sid||!nick||!sec)return;
  currentStudentId=sid;currentNickname=nick;currentSection=sec;
  document.getElementById('formSection').style.display='none';
  document.getElementById('quizSection').style.display='block';
  document.getElementById('resultSection').style.display='none';
  renderQuestions(sid,nick);
}

function renderQuestions(sid,nick){
  userAnswers={};var seed=parseInt(sid)*137+attempts*999983;
  displayQuestions=isKyleTestMode?questions.slice():seededShuffle(questions,seed);
  document.getElementById('quizStudentInfo').textContent=nick+' | '+currentSection;
  updateAttemptsDisplay();
  var c=document.getElementById('questionsContainer');c.innerHTML='';
  displayQuestions.forEach(function(q,i){
    var opts=isKyleTestMode?q.options.slice():seededShuffle(q.options,seed+q.id*100);
    var card=document.createElement('div');card.className='question-card';card.setAttribute('data-qid',q.id);
    var nb=document.createElement('div');nb.className='question-number';nb.textContent='Question '+(i+1);card.appendChild(nb);
    var img=document.createElement('img');img.className='question-image';img.src='WS6M4A2Q'+q.id+'.png';img.alt='Question '+q.id;card.appendChild(img);
    var qt=document.createElement('div');qt.className='question-text';qt.textContent=q.text;card.appendChild(qt);
    var g=document.createElement('div');g.className='options-grid';
    opts.forEach(function(opt){var btn=document.createElement('button');btn.className='option-btn';btn.setAttribute('data-qid',q.id);btn.setAttribute('data-opt',opt);btn.onclick=function(){selectOption(q.id,opt,card);};btn.appendChild(document.createTextNode(opt));g.appendChild(btn);});
    card.appendChild(g);c.appendChild(card);
  });
  quizLocked=false;
}

function selectOption(qid,opt,card){
  if(quizLocked)return;
  userAnswers[qid]=opt;
  card.querySelectorAll('.option-btn').forEach(function(b){b.classList.toggle('selected',b.getAttribute('data-opt')===opt);});
  card.classList.add('answered');
  
}

function updateAttemptsDisplay(){document.getElementById('attemptsDisplay').textContent='Attempt '+(attempts+1)+' of '+maxAttempts;}

async function submitQuiz(){
  if(Object.keys(userAnswers).length<displayQuestions.length){alert('Please answer all '+displayQuestions.length+' questions before submitting.');return;}
  quizLocked=true;attempts++;var score=0;
  displayQuestions.forEach(function(q){
    var chosen=userAnswers[q.id],ok=(chosen===q.answer);
    if(ok)score++;
    var card=document.querySelector('.question-card[data-qid="'+q.id+'"]');
    if(card)card.querySelectorAll('.option-btn').forEach(function(b){var o=b.getAttribute('data-opt');if(o===q.answer)b.classList.add('correct');else if(o===chosen&&!ok)b.classList.add('incorrect');b.disabled=true;});
  });
  document.getElementById('submitBtn').style.display='none';
  captureSubmissionTime(currentSection);
  if(!TEST_STUDENT_IDS.includes(currentStudentId)){
    submitToSheet(currentStudentId,currentNickname,currentSection,score,score>=8?'PASSED':'FAILED');
  }
  showResult(score);
}

function showResult(score){
  var p=score>=8;
  var ci=document.getElementById('scoreCircle');ci.textContent=score+'/10';ci.className='score-circle '+(p?'score-pass':'score-fail');
  document.getElementById('scoreLabel').textContent=p?'🎉 Excellent work!':'📚 Keep practicing!';
  document.getElementById('scoreSub').textContent=currentNickname+' | '+currentSection+' | Attempt '+attempts;
  showTimestampEl();
  var fb=document.getElementById('feedbackMsg');fb.className='feedback-msg '+(p?'feedback-pass':'feedback-fail');
  fb.textContent=p?'Great job! You scored '+score+' out of 10.':'You scored '+score+' out of 10. '+(attempts<maxAttempts?'You have '+(maxAttempts-attempts)+' attempt(s) left.':'No more attempts.');
  document.getElementById('quizSection').style.display='none';
  document.getElementById('resultSection').style.display='block';
  document.getElementById('retryBtn').style.display=(!p&&attempts<maxAttempts)?'block':'none';
}

function retryQuiz(){document.getElementById('resultSection').style.display='none';document.getElementById('quizSection').style.display='block';renderQuestions(currentStudentId,currentNickname);}

function submitToSheet(studentId,nickname,section,score,status){
  var ts=document.getElementById('thaiName');
  var tn=ts&&ts.selectedIndex>0?ts.options[ts.selectedIndex].dataset.name||nickname:nickname;
  var ans={};
  displayQuestions.forEach(function(q){
    ans['Q'+q.id]={question:q.text,selected:userAnswers[q.id]||null,correct_answer:q.answer,is_correct:(userAnswers[q.id]===q.answer),question_image:'WS6M4A2Q'+q.id+'.png'};
  });
  ans['_meta']={code:'WS6M4A2'};
  fetch(SUPABASE_URL+'/rest/v1/worksheet_submissions',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({student_id:String(studentId),student_name:tn,section:section,worksheet:'WS6',score:Number(score),total_questions:10,status:status,submitted_at:submissionTimestampISO,answers:ans})}).catch(function(e){console.warn('Supabase error:',e);});
  var params=new URLSearchParams({studentId:studentId,nickname:nickname,section:section,score:score,worksheet:'WS6',date:new Date().toISOString().split('T')[0],status:status});
  fetch(SCRIPT_URL+'?'+params.toString(),{method:'GET',mode:'no-cors'}).catch(function(e){console.warn('Script error:',e);});
}
</script>
</body></html>
